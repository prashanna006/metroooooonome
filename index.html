<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<title>Metroooooonome</title>

<link
  rel="stylesheet"
  href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css"
/>

<link rel="stylesheet" href="styles.css">
</head>
<body>

<div id="app">

  <div class="topbar">
    <div class="app-title">Metroooooonome</div>

    <button id="theme-btn">
      <i class="ti ti-moon"></i>
    </button>
  </div>

  <div class="beat-dots" id="beat-dots"></div>

  <div class="bpm-section">

    <div class="jump-col">
      <button class="jump-btn" data-delta="-20">− 20</button>
      <button class="jump-btn" data-delta="-5">− 5</button>
      <button class="jump-btn" data-delta="-1">− 1</button>
    </div>

    <div class="scroll-wheel-wrap" id="scroll-wheel">
      <div class="bpm-display" id="bpm-display">120</div>

      <div class="bpm-label">BPM</div>

      <div class="scroll-hint">
        <i class="ti ti-arrows-vertical"></i>
        scroll / drag
      </div>
    </div>

    <div class="jump-col">
      <button class="jump-btn" data-delta="20">+ 20</button>
      <button class="jump-btn" data-delta="5">+ 5</button>
      <button class="jump-btn" data-delta="1">+ 1</button>
    </div>

  </div>

  <div class="play-wrap">
    <button class="play-btn" id="play-btn">
      <i class="ti ti-player-play" id="play-icon"></i>
    </button>
  </div>

  <div class="time-sig">

    <button class="sig-btn" data-beats="2">2/4</button>

    <button class="sig-btn active" data-beats="4">
      4/4
    </button>

    <button class="sig-btn" data-beats="3">3/4</button>

    <button class="sig-btn" data-beats="6">6/8</button>

  </div>

  <hr class="divider">

  <div class="ramp-section">

    <div class="ramp-header">

      <div class="ramp-title">
        Practice ramp
      </div>

      <button class="toggle-ramp" id="toggle-ramp">
        Configure ▾
      </button>

    </div>

    <div class="ramp-body" id="ramp-body">

      <div class="ramp-grid">

        <div class="ramp-field">
          <label>Start BPM</label>
          <input type="number" id="r-start" value="60">
        </div>

        <div class="ramp-field">
          <label>End BPM</label>
          <input type="number" id="r-end" value="120">
        </div>

        <div class="ramp-field">
          <label>Repeats per step</label>
          <input type="number" id="r-reps" value="4">
        </div>

        <div class="ramp-field">
          <label>Increase by</label>
          <input type="number" id="r-step" value="5">
        </div>

      </div>

      <div class="countdown-row">

        <label>
          Countdown before start
        </label>

        <div class="countdown-sec-wrap">
          <input
            type="number"
            id="cd-secs"
            value="5"
            disabled
          >

          <span>sec</span>
        </div>

        <button
          class="countdown-toggle"
          id="cd-toggle"
        ></button>

      </div>

      <div class="ramp-preview" id="ramp-preview">
        —
      </div>

      <button
        class="ramp-start-btn"
        id="ramp-start-btn"
      >
        Start ramp
      </button>

      <div class="ramp-status" id="ramp-status"></div>

    </div>

  </div>

</div>

<div id="countdown-overlay">

  <div class="cd-number" id="cd-number">
    5
  </div>

  <div class="cd-label">
    get ready…
  </div>

  <button class="cd-cancel" id="cd-cancel">
    Cancel
  </button>

</div>

<script src="script.js"></script>

</body>
</html>
